<svg xmlns="http://www.w3.org/2000/svg" class="ad-diagram" viewBox="0 0 720 392" role="img" aria-labelledby="thr-t thr-d"><style>svg{--ad-main:#00ff41;--ad-hot:#ffcc00;--ad-fg:#d1d5db;--ad-muted:#9ca3af;--background:#0a0f0a;background:#0a0f0a;font-family:monospace}
.ad-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.ad-diagram text { fill: var(--ad-fg); font-size: 13px; font-family: inherit; }
.ad-diagram .ad-small { fill: var(--ad-muted); font-size: 11.5px; }
.ad-diagram .ad-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background, #0a0f0a); stroke-width: 5px; stroke-linejoin: round; }
.ad-diagram .ad-label-main { fill: var(--ad-main); }
.ad-diagram .ad-label-hot { fill: var(--ad-hot); }
.ad-diagram .ad-legend-main { fill: var(--ad-main); }
.ad-diagram .ad-legend-hot { fill: var(--ad-hot); }
.ad-diagram .ad-stat { font-size: 14px; }
.ad-diagram .ad-stat-main { fill: var(--ad-main); }
.ad-diagram .ad-stat-hot { fill: var(--ad-hot); }
.ad-diagram .ad-axis { stroke: var(--ad-muted); stroke-width: 1.2; opacity: .8; }
.ad-diagram .ad-dot { fill: var(--ad-main); stroke: var(--background, #0a0f0a); stroke-width: 2; }
.ad-diagram .ad-dot-target { fill: var(--ad-hot); }
.ad-diagram .ad-cut { stroke: var(--ad-hot); stroke-width: 1.8; stroke-dasharray: 5 4; }
.ad-diagram .ad-dropped { fill: var(--ad-muted); opacity: .14; }
.ad-diagram .ad-curve { fill: none; stroke: var(--ad-main); stroke-width: 2; stroke-linejoin: round; }
.ad-diagram .ad-thresh { stroke: var(--ad-hot); stroke-width: 1.5; stroke-dasharray: 5 4; }
.ad-diagram .ad-marker { fill: none; stroke: var(--ad-hot); stroke-width: 2; }
.ad-diagram .ad-hill-normal { fill: color-mix(in srgb, var(--ad-main) 14%, var(--background, #0a0f0a)); stroke: var(--ad-main); stroke-opacity: .5; stroke-width: 1; }
.ad-diagram .ad-hill-fraud { fill: color-mix(in srgb, var(--ad-hot) 22%, var(--background, #0a0f0a)); stroke: var(--ad-hot); stroke-opacity: .7; stroke-width: 1; }
.ad-diagram .ad-flagged { fill: var(--ad-hot); opacity: .08; }
.ad-diagram .ad-legend-hot { fill: var(--ad-hot); }
.ad-diagram .ad-stat { font-size: 14px; }</style><title id="thr-t">Sliding the alert threshold trades precision against recall</title><desc id="thr-d">Schematic score hills for 10,000 payments, 20 of them real fraud. As the threshold slides from strict to very loose, flagged payments go 10, 40, 100, 400; precision goes 80, 35, 16, 4.5 percent; recall goes 40, 70, 80, 90 percent.</desc><g opacity="1"><path class="ad-hill-normal" d="M40 190 L40.0 181.6 L50.7 178.8 L61.3 175.4 L72.0 171.1 L82.7 166.0 L93.3 160.1 L104.0 153.3 L114.7 145.6 L125.3 137.2 L136.0 128.3 L146.7 119.1 L157.3 109.8 L168.0 100.7 L178.7 92.3 L189.3 84.8 L200.0 78.6 L210.7 73.9 L221.3 71.0 L232.0 70.0 L242.7 71.0 L253.3 73.9 L264.0 78.6 L274.7 84.8 L285.3 92.3 L296.0 100.7 L306.7 109.8 L317.3 119.1 L328.0 128.3 L338.7 137.2 L349.3 145.6 L360.0 153.3 L370.7 160.1 L381.3 166.0 L392.0 171.1 L402.7 175.4 L413.3 178.8 L424.0 181.6 L434.7 183.8 L445.3 185.5 L456.0 186.8 L466.7 187.8 L477.3 188.4 L488.0 188.9 L498.7 189.3 L509.3 189.5 L520.0 189.7 L530.7 189.8 L541.3 189.9 L552.0 189.9 L562.7 190.0 L573.3 190.0 L584.0 190.0 L594.7 190.0 L605.3 190.0 L616.0 190.0 L626.7 190.0 L637.3 190.0 L648.0 190.0 L658.7 190.0 L669.3 190.0 L680.0 190.0 L680 190 Z"></path><path class="ad-hill-fraud" d="M40 190 L40.0 190.0 L50.7 190.0 L61.3 190.0 L72.0 190.0 L82.7 190.0 L93.3 190.0 L104.0 190.0 L114.7 190.0 L125.3 190.0 L136.0 190.0 L146.7 190.0 L157.3 190.0 L168.0 190.0 L178.7 190.0 L189.3 190.0 L200.0 190.0 L210.7 190.0 L221.3 190.0 L232.0 190.0 L242.7 190.0 L253.3 190.0 L264.0 190.0 L274.7 190.0 L285.3 190.0 L296.0 190.0 L306.7 190.0 L317.3 189.9 L328.0 189.9 L338.7 189.8 L349.3 189.6 L360.0 189.4 L370.7 189.0 L381.3 188.3 L392.0 187.4 L402.7 186.0 L413.3 184.2 L424.0 181.8 L434.7 178.7 L445.3 175.1 L456.0 171.0 L466.7 166.6 L477.3 162.2 L488.0 158.0 L498.7 154.4 L509.3 151.7 L520.0 150.2 L530.7 150.1 L541.3 151.3 L552.0 153.8 L562.7 157.2 L573.3 161.3 L584.0 165.7 L594.7 170.2 L605.3 174.4 L616.0 178.1 L626.7 181.2 L637.3 183.7 L648.0 185.7 L658.7 187.1 L669.3 188.2 L680.0 188.9 L680 190 Z"></path><line class="ad-axis" x1="40" y1="190" x2="680" y2="190"></line><text class="ad-small" x="40" y="208" text-anchor="start">low anomaly score</text><text class="ad-small" x="680" y="208" text-anchor="end">high anomaly score</text><text class="ad-small ad-legend-main" x="40" y="226" text-anchor="start">green: normal payments</text><text class="ad-small ad-legend-hot" x="680" y="226" text-anchor="end">yellow: real fraud</text><rect class="ad-flagged" x="488" y="40" width="192" height="150"></rect><line class="ad-thresh" x1="488" y1="34" x2="488" y2="196"></line><text class="ad-label ad-label-hot" x="488" y="28" text-anchor="middle">medium threshold</text><g><text class="ad-stat" x="40" y="260">flagged: 40</text><text class="ad-stat" x="40" y="284">real fraud among them: 14 of 20</text><text class="ad-stat ad-stat-main" x="40" y="314">precision 14/40 = 35%</text><text class="ad-stat ad-stat-hot" x="40" y="338">recall 14/20 = 70%</text><text class="ad-small" x="40" y="366">for comparison, always saying &quot;normal&quot;: 99.8% accurate, 0% recall</text></g></g></svg>
