<svg xmlns="http://www.w3.org/2000/svg" class="rv-diagram" viewBox="0 0 720 340" role="img" aria-labelledby="lat-t lat-d"><style>svg{--rv-main:#00ff41;--rv-hot:#ffcc00;--rv-fg:#d1d5db;--rv-muted:#9ca3af;--background:#0a0f0a;background:#0a0f0a;font-family:monospace}
.rv-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.rv-diagram text { fill: var(--rv-fg); font-size: 13px; font-family: inherit; }
.rv-diagram .rv-small { fill: var(--rv-muted); font-size: 11.5px; }
.rv-diagram .rv-hot { fill: var(--rv-hot); }
.rv-diagram .rv-label { font-size: 13px; }
.rv-diagram .rv-label-hot { fill: var(--rv-hot); }
.rv-diagram .rv-label-main { fill: var(--rv-main); }
.rv-diagram .rv-step { font-size: 13px; }
.rv-diagram .rv-stat { font-size: 14px; }
.rv-diagram .rv-stat-hot { fill: var(--rv-hot); }
.rv-diagram .rv-num { fill: var(--rv-muted); font-size: 13px; }
.rv-diagram .rv-num-like { fill: var(--rv-main); }
.rv-diagram .rv-num-hot { fill: var(--rv-hot); font-size: 15px; }
.rv-diagram .rv-cell { fill: none; stroke: var(--rv-muted); stroke-opacity: .25; stroke-width: 1; }
.rv-diagram .rv-cell-like { fill: color-mix(in srgb, var(--rv-main) 14%, var(--background, #0a0f0a)); stroke: var(--rv-main); stroke-opacity: .5; }
.rv-diagram .rv-cell-focus { stroke: var(--rv-hot); stroke-opacity: 1; stroke-width: 2; }
.rv-diagram .rv-cell-rec { fill: color-mix(in srgb, var(--rv-hot) 18%, var(--background, #0a0f0a)); stroke: var(--rv-hot); stroke-width: 2; }
.rv-diagram .rv-row { fill: var(--rv-hot); opacity: .08; }
.rv-diagram .rv-plot { fill: none; stroke: var(--rv-muted); stroke-opacity: .35; stroke-width: 1; }
.rv-diagram .rv-axis { stroke: var(--rv-muted); stroke-width: 1; opacity: .35; }
.rv-diagram .rv-factor-axis { stroke: var(--rv-hot); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .85; }
.rv-diagram .rv-user { stroke: var(--rv-main); stroke-width: 1.6; }
.rv-diagram .rv-user-tip { fill: var(--rv-main); }
.rv-diagram .rv-user-hot { stroke: var(--rv-hot); stroke-width: 2.4; }
.rv-diagram circle.rv-user-hot { fill: var(--rv-hot); stroke: none; }
.rv-diagram .rv-dish { fill: var(--rv-fg); }
.rv-diagram .rv-dish-hot { fill: var(--rv-hot); }
.rv-diagram .rv-chip { fill: none; stroke-width: 1.2; }
.rv-diagram .rv-chip-ok { stroke: var(--rv-main); stroke-opacity: .6; fill: color-mix(in srgb, var(--rv-main) 10%, var(--background, #0a0f0a)); }
.rv-diagram .rv-chip-no { stroke: var(--rv-hot); stroke-opacity: .7; fill: color-mix(in srgb, var(--rv-hot) 10%, var(--background, #0a0f0a)); }
.rv-diagram .rv-chip-mark { font-size: 16px; }
.rv-diagram .rv-ok { fill: var(--rv-main); }
.rv-diagram .rv-no { fill: var(--rv-hot); }
.rv-diagram .rv-chiptext { fill: var(--rv-fg); }</style><title id="lat-t">Rotating the latent axes changes every coordinate but not the predictions</title><desc id="lat-d">Six users are drawn as arrows and five dishes as squares on a two-dimensional map of learned factors. A pair of dashed factor axes rotates over the map. Every coordinate changes as the axes turn, but the dot product between Esha and Idli stays at 0.225, so the predicted ratings do not change.</desc><g opacity="1"><rect class="rv-plot" x="55" y="35" width="270" height="270"></rect><g><line class="rv-factor-axis" x1="62.94117647058823" y1="170" x2="317.05882352941177" y2="170"></line><text class="rv-small rv-hot" x="331.3529411764706" y="174" text-anchor="start">factor 1</text></g><g><line class="rv-factor-axis" x1="190" y1="297.05882352941177" x2="190" y2="42.94117647058823"></line><text class="rv-small rv-hot" x="190" y="32.64705882352942" text-anchor="middle">factor 2</text></g><g opacity="0.6"><line class="rv-user" x1="190" y1="170" x2="103.87794117647059" y2="245.25058823529412"></line><circle class="rv-user-tip" cx="103.87794117647059" cy="245.25058823529412" r="3"></circle><text class="rv-small" x="96.87794117647059" y="249.25058823529412" text-anchor="end">Asha</text></g><g opacity="0.6"><line class="rv-user" x1="190" y1="170" x2="179.9385294117647" y2="259.5129411764706"></line><circle class="rv-user-tip" cx="179.9385294117647" cy="259.5129411764706" r="3"></circle><text class="rv-small" x="186.9385294117647" y="263.5129411764706" text-anchor="start">Bilal</text></g><g opacity="0.6"><line class="rv-user" x1="190" y1="170" x2="316.4314705882353" y2="167.18088235294118"></line><circle class="rv-user-tip" cx="316.4314705882353" cy="167.18088235294118" r="3"></circle><text class="rv-small" x="322.4314705882353" y="159.18088235294118" text-anchor="start">Chetan</text></g><g opacity="0.6"><line class="rv-user" x1="190" y1="170" x2="196.98029411764705" y2="110.01235294117649"></line><circle class="rv-user-tip" cx="196.98029411764705" cy="110.01235294117649" r="3"></circle><text class="rv-small" x="203.98029411764705" y="114.01235294117649" text-anchor="start">Divya</text></g><g opacity="1"><line class="rv-user rv-user-hot" x1="190" y1="170" x2="106.93529411764706" y2="200.28764705882352"></line><circle class="rv-user-tip rv-user-hot" cx="106.93529411764706" cy="200.28764705882352" r="4"></circle><text class="rv-small" x="114.93529411764706" y="216.28764705882352" text-anchor="start">Esha</text></g><g opacity="0.6"><line class="rv-user" x1="190" y1="170" x2="150.7308823529412" y2="56.91764705882355"></line><circle class="rv-user-tip" cx="150.7308823529412" cy="56.91764705882355" r="3"></circle><text class="rv-small" x="143.7308823529412" y="60.91764705882355" text-anchor="end">Farhan</text></g><g opacity="0.75"><rect class="rv-dish" x="75.87176470588236" y="188.85470588235293" width="8" height="8"></rect><text class="rv-small rv-dishlabel" x="71.87176470588236" y="196.85470588235293" text-anchor="end">Dosa</text></g><g opacity="1"><rect class="rv-dish rv-dish-hot" x="212.08676470588236" y="284.3235294117647" width="8" height="8"></rect><text class="rv-small rv-dishlabel" x="224.08676470588236" y="292.3235294117647" text-anchor="start">Idli</text></g><g opacity="0.75"><rect class="rv-dish" x="300.4958823529412" y="119.32970588235295" width="8" height="8"></rect><text class="rv-small rv-dishlabel" x="304.4958823529412" y="114.32970588235295" text-anchor="middle">Biryani</text></g><g opacity="0.75"><rect class="rv-dish" x="231.71735294117647" y="59.41352941176471" width="8" height="8"></rect><text class="rv-small rv-dishlabel" x="243.71735294117647" y="67.41352941176471" text-anchor="start">Kebab</text></g><g opacity="0.75"><rect class="rv-dish" x="122.86764705882354" y="111.92058823529412" width="8" height="8"></rect><text class="rv-small rv-dishlabel" x="118.86764705882354" y="119.92058823529412" text-anchor="end">Noodles</text></g><text class="rv-stat" x="400" y="60">axes turned by 0°</text><text class="rv-small" x="400" y="88">Esha  = (-1.05, -0.38)</text><text class="rv-small" x="400" y="108">Idli  = (0.33, -1.49)</text><text class="rv-stat rv-stat-hot" x="400" y="142">Esha · Idli = 0.225</text><text class="rv-small" x="400" y="164">same at every angle</text><text class="rv-small" x="400" y="200">predicted rating =</text><text class="rv-small" x="400" y="220">3.5 + (-0.186) + (-0.126) + 0.225 = 3.413</text><text class="rv-small" x="400" y="240">global mean + Esha bias + Idli bias + dot</text></g></svg>
