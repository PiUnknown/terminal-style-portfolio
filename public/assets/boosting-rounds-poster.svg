<svg xmlns="http://www.w3.org/2000/svg" class="ens-diagram" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Boosting rounds on the fest footfall. A marker starts at the base guess 600, far from the actual 890. Round by round it hops closer: +240 to 840, then +35 to 875, then +12 to 887. The leftover residual shrinks each round: 290, then 50, then 15, then 3."><style>
svg.ens-diagram{--ens-main:#00ff41;--ens-corr:#ffcc00;--ens-fg:#d1d5db;--ens-muted:#9ca3af;--background:#0a0f0a;font-family:'JetBrains Mono',monospace;background:var(--background)}
.ens-diagram { display:block;width:100%;height:auto }
.ens-diagram text { fill: var(--ens-fg); font-size: 13px; font-family: inherit; }
.ens-diagram .ens-small { fill: var(--ens-muted); font-size: 11.5px; }
.ens-diagram .ens-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background); stroke-width: 5px; stroke-linejoin: round; }
.ens-diagram .ens-label-truth { fill: var(--ens-main); }
.ens-diagram .ens-label-hop { fill: var(--ens-corr); }
.ens-diagram .ens-label-total { fill: var(--ens-fg); }
.ens-diagram .ens-axis { stroke: var(--ens-muted); stroke-width: 1.2; opacity: .8; }
.ens-diagram .ens-truth { stroke: var(--ens-main); stroke-width: 1.4; stroke-dasharray: 5 4; }
.ens-diagram .ens-hop { fill: none; stroke: var(--ens-corr); stroke-width: 1.6; stroke-dasharray: 4 3; }
.ens-diagram .ens-dot { fill: var(--ens-main); stroke: var(--background); stroke-width: 2; }
.ens-diagram .ens-bar { fill: rgba(255,204,0,.24); stroke: var(--ens-corr); stroke-opacity: .6; stroke-width: 1; }
</style>
