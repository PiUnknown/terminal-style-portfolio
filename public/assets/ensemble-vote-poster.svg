<g><rect class="ens-box" x="30" y="141" width="168" height="46" rx="6"/><text class="ens-small" x="40" y="158">tree 2 · sample B</text><text class="ens-num" x="40" y="177">940</text></g>
<g><rect class="ens-box" x="30" y="213" width="168" height="46" rx="6"/><text class="ens-small" x="40" y="230">tree 3 · sample C</text><text class="ens-num" x="40" y="249">710</text></g>
<g><rect class="ens-box" x="30" y="285" width="168" height="46" rx="6"/><text class="ens-small" x="40" y="302">tree 4 · sample D</text><text class="ens-num" x="40" y="321">1010</text></g>
