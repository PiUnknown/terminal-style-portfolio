<svg xmlns="http://www.w3.org/2000/svg" class="ens-diagram" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="Five small trees, each trained on a different bootstrap sample, predict the fest footfall: 820, 940, 710, 1010 and 880. Their predictions flow into an averaging step that outputs 872. The actual turnout is 890, so the ensemble misses by 18, while the average single-model miss is 86."><style>
svg.ens-diagram{--ens-main:#00ff41;--ens-corr:#ffcc00;--ens-fg:#d1d5db;--ens-muted:#9ca3af;--background:#0a0f0a;font-family:'JetBrains Mono',monospace;background:var(--background)}
.ens-diagram { display:block;width:100%;height:auto }
.ens-diagram text { fill: var(--ens-fg); font-size: 13px; font-family: inherit; }
.ens-diagram .ens-small { fill: var(--ens-muted); font-size: 11.5px; }
.ens-diagram .ens-num { fill: var(--ens-fg); font-size: 15px; font-weight: 600; }
.ens-diagram .ens-num-out { fill: var(--ens-main); font-size: 17px; font-weight: 600; }
.ens-diagram .ens-box { fill: rgba(0,255,65,.08); stroke: var(--ens-main); stroke-opacity: .5; stroke-width: 1.2; }
.ens-diagram .ens-box-out { fill: rgba(0,255,65,.16); stroke-opacity: .9; }
.ens-diagram .ens-wire { fill: none; stroke: var(--ens-muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .7; }
.ens-diagram .ens-combiner { fill: var(--background); stroke: var(--ens-main); stroke-width: 1.6; }
.ens-diagram .ens-combiner-text { fill: var(--ens-main); font-size: 13px; }
</style>
