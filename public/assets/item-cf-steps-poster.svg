<svg xmlns="http://www.w3.org/2000/svg" class="rv-diagram" viewBox="0 0 720 320" role="img" aria-labelledby="icf-t icf-d"><style>svg{--rv-main:#00ff41;--rv-hot:#ffcc00;--rv-fg:#d1d5db;--rv-muted:#9ca3af;--background:#0a0f0a;background:#0a0f0a;font-family:monospace}
.rv-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.rv-diagram text { fill: var(--rv-fg); font-size: 13px; font-family: inherit; }
.rv-diagram .rv-small { fill: var(--rv-muted); font-size: 11.5px; }
.rv-diagram .rv-hot { fill: var(--rv-hot); }
.rv-diagram .rv-label { font-size: 13px; }
.rv-diagram .rv-label-hot { fill: var(--rv-hot); }
.rv-diagram .rv-label-main { fill: var(--rv-main); }
.rv-diagram .rv-step { font-size: 13px; }
.rv-diagram .rv-stat { font-size: 14px; }
.rv-diagram .rv-stat-hot { fill: var(--rv-hot); }
.rv-diagram .rv-num { fill: var(--rv-muted); font-size: 13px; }
.rv-diagram .rv-num-like { fill: var(--rv-main); }
.rv-diagram .rv-num-hot { fill: var(--rv-hot); font-size: 15px; }
.rv-diagram .rv-cell { fill: none; stroke: var(--rv-muted); stroke-opacity: .25; stroke-width: 1; }
.rv-diagram .rv-cell-like { fill: color-mix(in srgb, var(--rv-main) 14%, var(--background, #0a0f0a)); stroke: var(--rv-main); stroke-opacity: .5; }
.rv-diagram .rv-cell-focus { stroke: var(--rv-hot); stroke-opacity: 1; stroke-width: 2; }
.rv-diagram .rv-cell-rec { fill: color-mix(in srgb, var(--rv-hot) 18%, var(--background, #0a0f0a)); stroke: var(--rv-hot); stroke-width: 2; }
.rv-diagram .rv-row { fill: var(--rv-hot); opacity: .08; }
.rv-diagram .rv-plot { fill: none; stroke: var(--rv-muted); stroke-opacity: .35; stroke-width: 1; }
.rv-diagram .rv-axis { stroke: var(--rv-muted); stroke-width: 1; opacity: .35; }
.rv-diagram .rv-factor-axis { stroke: var(--rv-hot); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .85; }
.rv-diagram .rv-user { stroke: var(--rv-main); stroke-width: 1.6; }
.rv-diagram .rv-user-tip { fill: var(--rv-main); }
.rv-diagram .rv-user-hot { stroke: var(--rv-hot); stroke-width: 2.4; }
.rv-diagram circle.rv-user-hot { fill: var(--rv-hot); stroke: none; }
.rv-diagram .rv-dish { fill: var(--rv-fg); }
.rv-diagram .rv-dish-hot { fill: var(--rv-hot); }
.rv-diagram .rv-chip { fill: none; stroke-width: 1.2; }
.rv-diagram .rv-chip-ok { stroke: var(--rv-main); stroke-opacity: .6; fill: color-mix(in srgb, var(--rv-main) 10%, var(--background, #0a0f0a)); }
.rv-diagram .rv-chip-no { stroke: var(--rv-hot); stroke-opacity: .7; fill: color-mix(in srgb, var(--rv-hot) 10%, var(--background, #0a0f0a)); }
.rv-diagram .rv-chip-mark { font-size: 16px; }
.rv-diagram .rv-ok { fill: var(--rv-main); }
.rv-diagram .rv-no { fill: var(--rv-hot); }
.rv-diagram .rv-chiptext { fill: var(--rv-fg); }</style><title id="icf-t">Item-based collaborative filtering on a small food-app ratings grid</title><desc id="icf-d">Six users rate five dishes from 1 to 5; empty cells are unrated. Esha liked Dosa. Asha and Bilal also liked Dosa, and both of them liked Idli, so Idli is recommended to Esha.</desc><g opacity="1"><text class="rv-small" x="260" y="36" text-anchor="middle">Dosa</text><text class="rv-small" x="360" y="36" text-anchor="middle">Idli</text><text class="rv-small" x="460" y="36" text-anchor="middle">Biryani</text><text class="rv-small" x="560" y="36" text-anchor="middle">Kebab</text><text class="rv-small" x="660" y="36" text-anchor="middle">Noodles</text><g><text class="rv-label" x="90" y="67">Asha</text><g><rect class="rv-cell rv-cell-like" x="213" y="49" width="94" height="28"></rect><text class="rv-num rv-num-like" x="260" y="67" text-anchor="middle">5</text></g><g><rect class="rv-cell rv-cell-like" x="313" y="49" width="94" height="28"></rect><text class="rv-num rv-num-like" x="360" y="67" text-anchor="middle">4</text></g><g><rect class="rv-cell" x="413" y="49" width="94" height="28"></rect><text class="rv-num" x="460" y="67" text-anchor="middle">·</text></g><g><rect class="rv-cell" x="513" y="49" width="94" height="28"></rect><text class="rv-num" x="560" y="67" text-anchor="middle">1</text></g><g><rect class="rv-cell" x="613" y="49" width="94" height="28"></rect><text class="rv-num" x="660" y="67" text-anchor="middle">·</text></g></g><g><text class="rv-label" x="90" y="101">Bilal</text><g><rect class="rv-cell rv-cell-like" x="213" y="83" width="94" height="28"></rect><text class="rv-num rv-num-like" x="260" y="101" text-anchor="middle">4</text></g><g><rect class="rv-cell rv-cell-like" x="313" y="83" width="94" height="28"></rect><text class="rv-num rv-num-like" x="360" y="101" text-anchor="middle">5</text></g><g><rect class="rv-cell" x="413" y="83" width="94" height="28"></rect><text class="rv-num" x="460" y="101" text-anchor="middle">2</text></g><g><rect class="rv-cell" x="513" y="83" width="94" height="28"></rect><text class="rv-num" x="560" y="101" text-anchor="middle">·</text></g><g><rect class="rv-cell" x="613" y="83" width="94" height="28"></rect><text class="rv-num" x="660" y="101" text-anchor="middle">1</text></g></g><g><text class="rv-label" x="90" y="135">Chetan</text><g><rect class="rv-cell" x="213" y="117" width="94" height="28"></rect><text class="rv-num" x="260" y="135" text-anchor="middle">1</text></g><g><rect class="rv-cell" x="313" y="117" width="94" height="28"></rect><text class="rv-num" x="360" y="135" text-anchor="middle">·</text></g><g><rect class="rv-cell rv-cell-like" x="413" y="117" width="94" height="28"></rect><text class="rv-num rv-num-like" x="460" y="135" text-anchor="middle">5</text></g><g><rect class="rv-cell rv-cell-like" x="513" y="117" width="94" height="28"></rect><text class="rv-num rv-num-like" x="560" y="135" text-anchor="middle">4</text></g><g><rect class="rv-cell" x="613" y="117" width="94" height="28"></rect><text class="rv-num" x="660" y="135" text-anchor="middle">2</text></g></g><g><text class="rv-label" x="90" y="169">Divya</text><g><rect class="rv-cell" x="213" y="151" width="94" height="28"></rect><text class="rv-num" x="260" y="169" text-anchor="middle">·</text></g><g><rect class="rv-cell" x="313" y="151" width="94" height="28"></rect><text class="rv-num" x="360" y="169" text-anchor="middle">2</text></g><g><rect class="rv-cell rv-cell-like" x="413" y="151" width="94" height="28"></rect><text class="rv-num rv-num-like" x="460" y="169" text-anchor="middle">4</text></g><g><rect class="rv-cell rv-cell-like" x="513" y="151" width="94" height="28"></rect><text class="rv-num rv-num-like" x="560" y="169" text-anchor="middle">5</text></g><g><rect class="rv-cell" x="613" y="151" width="94" height="28"></rect><text class="rv-num" x="660" y="169" text-anchor="middle">·</text></g></g><g><text class="rv-label rv-label-hot" x="90" y="203">Esha</text><g><rect class="rv-cell rv-cell-like" x="213" y="185" width="94" height="28"></rect><text class="rv-num rv-num-like" x="260" y="203" text-anchor="middle">5</text></g><g><rect class="rv-cell" x="313" y="185" width="94" height="28"></rect><text class="rv-num" x="360" y="203" text-anchor="middle">·</text></g><g><rect class="rv-cell" x="413" y="185" width="94" height="28"></rect><text class="rv-num" x="460" y="203" text-anchor="middle">1</text></g><g><rect class="rv-cell" x="513" y="185" width="94" height="28"></rect><text class="rv-num" x="560" y="203" text-anchor="middle">·</text></g><g><rect class="rv-cell rv-cell-like" x="613" y="185" width="94" height="28"></rect><text class="rv-num rv-num-like" x="660" y="203" text-anchor="middle">4</text></g></g><g><text class="rv-label" x="90" y="237">Farhan</text><g><rect class="rv-cell" x="213" y="219" width="94" height="28"></rect><text class="rv-num" x="260" y="237" text-anchor="middle">2</text></g><g><rect class="rv-cell" x="313" y="219" width="94" height="28"></rect><text class="rv-num" x="360" y="237" text-anchor="middle">1</text></g><g><rect class="rv-cell" x="413" y="219" width="94" height="28"></rect><text class="rv-num" x="460" y="237" text-anchor="middle">·</text></g><g><rect class="rv-cell rv-cell-like" x="513" y="219" width="94" height="28"></rect><text class="rv-num rv-num-like" x="560" y="237" text-anchor="middle">5</text></g><g><rect class="rv-cell rv-cell-like" x="613" y="219" width="94" height="28"></rect><text class="rv-num rv-num-like" x="660" y="237" text-anchor="middle">5</text></g></g><g><rect class="rv-cell rv-cell-rec" x="313" y="185" width="94" height="28"></rect><text class="rv-num rv-num-hot" x="360" y="203" text-anchor="middle">?</text></g><text class="rv-step" x="90" y="276">Step 5: recommend Idli to Esha.</text><text class="rv-step" x="90" y="296">Her empty Idli cell means unseen, not disliked.</text></g></svg>
