<svg xmlns="http://www.w3.org/2000/svg" class="ev-diagram" viewBox="-6 -10 732 346" width="732" height="346" role="img" aria-labelledby="p p"><style>svg.ev-diagram{--ev-train:#00ff41;--ev-held:#ffcc00;--ev-fg:#d1d5db;--ev-muted:#9ca3af;--background:#0a0f0a;font-family:'JetBrains Mono',monospace}
.ev-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.ev-diagram text { fill: var(--ev-fg); font-size: 13px; font-family: inherit; }
.ev-diagram .ev-small { fill: var(--ev-muted); font-size: 11.5px; }
.ev-diagram .ev-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background, #0a0f0a); stroke-width: 5px; stroke-linejoin: round; }
.ev-diagram .ev-label-a { fill: var(--ev-fg); }
.ev-diagram .ev-label-b { fill: var(--ev-train); }
.ev-diagram .ev-label-held { fill: var(--ev-held); }
.ev-diagram .ev-grid { stroke: var(--ev-muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .35; }
.ev-diagram .ev-axis { stroke: var(--ev-muted); stroke-width: 1.2; opacity: .8; }
.ev-diagram .ev-sweet { stroke: var(--ev-train); stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }
.ev-diagram .ev-miss { stroke: var(--ev-fg); stroke-width: 1.4; stroke-dasharray: 4 3; }
.ev-diagram .ev-line-a, .ev-diagram .ev-line-b, .ev-diagram .ev-line-held { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ev-diagram .ev-line-a { stroke: var(--ev-fg); }
.ev-diagram .ev-line-b { stroke: var(--ev-train); }
.ev-diagram .ev-line-held { stroke: var(--ev-held); }
.ev-diagram .ev-key { stroke-width: 2.4; }
.ev-diagram .ev-dot-train { fill: var(--ev-train); }
.ev-diagram .ev-dot-held { fill: var(--background, #0a0f0a); stroke: var(--ev-held); stroke-width: 2.2; }
.ev-diagram .ev-cell-train { fill: color-mix(in srgb, var(--ev-train) 12%, var(--background, #0a0f0a)); stroke: var(--ev-train); stroke-opacity: .45; stroke-width: 1; }
.ev-diagram .ev-cell-test { fill: color-mix(in srgb, var(--ev-held) 22%, var(--background, #0a0f0a)); stroke: var(--ev-held); stroke-width: 1.4; }
.ev-diagram .ev-cell-text { fill: var(--ev-muted); font-size: 11.5px; }
.ev-diagram .ev-cell-text-test { fill: var(--ev-held); }
.ev-diagram .ev-score { fill: var(--ev-train); font-size: 15px; }</style><rect x="-6" y="-10" width="732" height="346" fill="#0a0f0a"/><title id="p">Five-fold cross-validation</title><desc id="p">The data is cut into five folds. In each of five rounds one fold is held out for testing and the other four train the model. The scores are 0.80, 0.84, 0.78, 0.82 and 0.86, which average to 0.82.</desc><text class="ev-small" x="135" y="16" text-anchor="middle">fold 1</text><text class="ev-small" x="241" y="16" text-anchor="middle">fold 2</text><text class="ev-small" x="347" y="16" text-anchor="middle">fold 3</text><text class="ev-small" x="453" y="16" text-anchor="middle">fold 4</text><text class="ev-small" x="559" y="16" text-anchor="middle">fold 5</text><text class="ev-small" x="624" y="16" text-anchor="start">score</text><g><g opacity="1"><text class="ev-small" x="0" y="53">round 1</text><g><rect class="ev-cell-test" x="84" y="34" width="102" height="30"></rect><text class="ev-cell-text ev-cell-text-test" x="135" y="53" text-anchor="middle">test</text></g><g><rect class="ev-cell-train" x="190" y="34" width="102" height="30"></rect><text class="ev-cell-text" x="241" y="53" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="296" y="34" width="102" height="30"></rect><text class="ev-cell-text" x="347" y="53" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="402" y="34" width="102" height="30"></rect><text class="ev-cell-text" x="453" y="53" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="508" y="34" width="102" height="30"></rect><text class="ev-cell-text" x="559" y="53" text-anchor="middle">train</text></g></g><text class="ev-score" opacity="1" x="624" text-anchor="start" y="54">0.80</text></g><g><g opacity="1"><text class="ev-small" x="0" y="97">round 2</text><g><rect class="ev-cell-train" x="84" y="78" width="102" height="30"></rect><text class="ev-cell-text" x="135" y="97" text-anchor="middle">train</text></g><g><rect class="ev-cell-test" x="190" y="78" width="102" height="30"></rect><text class="ev-cell-text ev-cell-text-test" x="241" y="97" text-anchor="middle">test</text></g><g><rect class="ev-cell-train" x="296" y="78" width="102" height="30"></rect><text class="ev-cell-text" x="347" y="97" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="402" y="78" width="102" height="30"></rect><text class="ev-cell-text" x="453" y="97" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="508" y="78" width="102" height="30"></rect><text class="ev-cell-text" x="559" y="97" text-anchor="middle">train</text></g></g><text class="ev-score" opacity="1" x="624" text-anchor="start" y="98">0.84</text></g><g><g opacity="1"><text class="ev-small" x="0" y="141">round 3</text><g><rect class="ev-cell-train" x="84" y="122" width="102" height="30"></rect><text class="ev-cell-text" x="135" y="141" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="190" y="122" width="102" height="30"></rect><text class="ev-cell-text" x="241" y="141" text-anchor="middle">train</text></g><g><rect class="ev-cell-test" x="296" y="122" width="102" height="30"></rect><text class="ev-cell-text ev-cell-text-test" x="347" y="141" text-anchor="middle">test</text></g><g><rect class="ev-cell-train" x="402" y="122" width="102" height="30"></rect><text class="ev-cell-text" x="453" y="141" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="508" y="122" width="102" height="30"></rect><text class="ev-cell-text" x="559" y="141" text-anchor="middle">train</text></g></g><text class="ev-score" opacity="1" x="624" text-anchor="start" y="142">0.78</text></g><g><g opacity="1"><text class="ev-small" x="0" y="185">round 4</text><g><rect class="ev-cell-train" x="84" y="166" width="102" height="30"></rect><text class="ev-cell-text" x="135" y="185" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="190" y="166" width="102" height="30"></rect><text class="ev-cell-text" x="241" y="185" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="296" y="166" width="102" height="30"></rect><text class="ev-cell-text" x="347" y="185" text-anchor="middle">train</text></g><g><rect class="ev-cell-test" x="402" y="166" width="102" height="30"></rect><text class="ev-cell-text ev-cell-text-test" x="453" y="185" text-anchor="middle">test</text></g><g><rect class="ev-cell-train" x="508" y="166" width="102" height="30"></rect><text class="ev-cell-text" x="559" y="185" text-anchor="middle">train</text></g></g><text class="ev-score" opacity="1" x="624" text-anchor="start" y="186">0.82</text></g><g><g opacity="1"><text class="ev-small" x="0" y="229">round 5</text><g><rect class="ev-cell-train" x="84" y="210" width="102" height="30"></rect><text class="ev-cell-text" x="135" y="229" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="190" y="210" width="102" height="30"></rect><text class="ev-cell-text" x="241" y="229" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="296" y="210" width="102" height="30"></rect><text class="ev-cell-text" x="347" y="229" text-anchor="middle">train</text></g><g><rect class="ev-cell-train" x="402" y="210" width="102" height="30"></rect><text class="ev-cell-text" x="453" y="229" text-anchor="middle">train</text></g><g><rect class="ev-cell-test" x="508" y="210" width="102" height="30"></rect><text class="ev-cell-text ev-cell-text-test" x="559" y="229" text-anchor="middle">test</text></g></g><text class="ev-score" opacity="1" x="624" text-anchor="start" y="230">0.86</text></g><g opacity="1"><line class="ev-grid" x1="0" x2="720" y1="264" y2="264"></line><text class="ev-label ev-label-b" x="0" y="284">average = (0.80 + 0.84 + 0.78 + 0.82 + 0.86) / 5 = 0.82</text><text class="ev-small" x="0" y="306">scores range from 0.78 to 0.86, and every row is tested exactly once</text></g></svg>