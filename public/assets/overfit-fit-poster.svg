<svg xmlns="http://www.w3.org/2000/svg" class="ev-diagram" viewBox="-6 -10 732 456" width="732" height="456" role="img" aria-labelledby="p p"><style>svg.ev-diagram{--ev-train:#00ff41;--ev-held:#ffcc00;--ev-fg:#d1d5db;--ev-muted:#9ca3af;--background:#0a0f0a;font-family:'JetBrains Mono',monospace}
.ev-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.ev-diagram text { fill: var(--ev-fg); font-size: 13px; font-family: inherit; }
.ev-diagram .ev-small { fill: var(--ev-muted); font-size: 11.5px; }
.ev-diagram .ev-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background, #0a0f0a); stroke-width: 5px; stroke-linejoin: round; }
.ev-diagram .ev-label-a { fill: var(--ev-fg); }
.ev-diagram .ev-label-b { fill: var(--ev-train); }
.ev-diagram .ev-label-held { fill: var(--ev-held); }
.ev-diagram .ev-grid { stroke: var(--ev-muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .35; }
.ev-diagram .ev-axis { stroke: var(--ev-muted); stroke-width: 1.2; opacity: .8; }
.ev-diagram .ev-sweet { stroke: var(--ev-train); stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }
.ev-diagram .ev-miss { stroke: var(--ev-fg); stroke-width: 1.4; stroke-dasharray: 4 3; }
.ev-diagram .ev-line-a, .ev-diagram .ev-line-b, .ev-diagram .ev-line-held { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ev-diagram .ev-line-a { stroke: var(--ev-fg); }
.ev-diagram .ev-line-b { stroke: var(--ev-train); }
.ev-diagram .ev-line-held { stroke: var(--ev-held); }
.ev-diagram .ev-key { stroke-width: 2.4; }
.ev-diagram .ev-dot-train { fill: var(--ev-train); }
.ev-diagram .ev-dot-held { fill: var(--background, #0a0f0a); stroke: var(--ev-held); stroke-width: 2.2; }
.ev-diagram .ev-cell-train { fill: color-mix(in srgb, var(--ev-train) 12%, var(--background, #0a0f0a)); stroke: var(--ev-train); stroke-opacity: .45; stroke-width: 1; }
.ev-diagram .ev-cell-test { fill: color-mix(in srgb, var(--ev-held) 22%, var(--background, #0a0f0a)); stroke: var(--ev-held); stroke-width: 1.4; }
.ev-diagram .ev-cell-text { fill: var(--ev-muted); font-size: 11.5px; }
.ev-diagram .ev-cell-text-test { fill: var(--ev-held); }
.ev-diagram .ev-score { fill: var(--ev-train); font-size: 15px; }</style><rect x="-6" y="-10" width="732" height="456" fill="#0a0f0a"/><title id="p">A degree-5 curve through six noisy training points versus a straight line</title><desc id="p">Deliberately constructed teaching example. Six training orders from 1 to 6 km took 16, 14, 24, 28, 28 and 37 minutes. A degree-5 curve passes through all six. A least-squares line, 9.4 plus 4.31 times km, misses them by up to 4 minutes. Three kept-aside orders: 2.5 km took 22 minutes (curve says 19.2, line says 20.2), 4.5 km took 31 (curve 27.8, line 28.8), and 7 km took 40 (curve 70, line 39.6).</desc><defs><clipPath id="p-clip"><rect x="52" y="16" width="648" height="270"></rect></clipPath></defs><g><line class="ev-grid" x1="52" x2="700" y1="286.0" y2="286.0"></line><text class="ev-small" x="44" y="290.0" text-anchor="end">0</text></g><g><line class="ev-grid" x1="52" x2="700" y1="218.5" y2="218.5"></line><text class="ev-small" x="44" y="222.5" text-anchor="end">20</text></g><g><line class="ev-grid" x1="52" x2="700" y1="151.0" y2="151.0"></line><text class="ev-small" x="44" y="155.0" text-anchor="end">40</text></g><g><line class="ev-grid" x1="52" x2="700" y1="83.5" y2="83.5"></line><text class="ev-small" x="44" y="87.5" text-anchor="end">60</text></g><g><line class="ev-grid" x1="52" x2="700" y1="16.0" y2="16.0"></line><text class="ev-small" x="44" y="20.0" text-anchor="end">80</text></g><text class="ev-small" x="99.0" y="304" text-anchor="middle">1</text><text class="ev-small" x="192.9" y="304" text-anchor="middle">2</text><text class="ev-small" x="286.8" y="304" text-anchor="middle">3</text><text class="ev-small" x="380.7" y="304" text-anchor="middle">4</text><text class="ev-small" x="474.6" y="304" text-anchor="middle">5</text><text class="ev-small" x="568.5" y="304" text-anchor="middle">6</text><text class="ev-small" x="662.4" y="304" text-anchor="middle">7</text><text class="ev-small" x="376.0" y="322" text-anchor="middle"