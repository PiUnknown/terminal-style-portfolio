<svg xmlns="http://www.w3.org/2000/svg" class="ev-diagram" viewBox="-6 -10 732 376" width="732" height="376" role="img" aria-labelledby="p p"><style>svg.ev-diagram{--ev-train:#00ff41;--ev-held:#ffcc00;--ev-fg:#d1d5db;--ev-muted:#9ca3af;--background:#0a0f0a;font-family:'JetBrains Mono',monospace}
.ev-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.ev-diagram text { fill: var(--ev-fg); font-size: 13px; font-family: inherit; }
.ev-diagram .ev-small { fill: var(--ev-muted); font-size: 11.5px; }
.ev-diagram .ev-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background, #0a0f0a); stroke-width: 5px; stroke-linejoin: round; }
.ev-diagram .ev-label-a { fill: var(--ev-fg); }
.ev-diagram .ev-label-b { fill: var(--ev-train); }
.ev-diagram .ev-label-held { fill: var(--ev-held); }
.ev-diagram .ev-grid { stroke: var(--ev-muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .35; }
.ev-diagram .ev-axis { stroke: var(--ev-muted); stroke-width: 1.2; opacity: .8; }
.ev-diagram .ev-sweet { stroke: var(--ev-train); stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }
.ev-diagram .ev-miss { stroke: var(--ev-fg); stroke-width: 1.4; stroke-dasharray: 4 3; }
.ev-diagram .ev-line-a, .ev-diagram .ev-line-b, .ev-diagram .ev-line-held { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ev-diagram .ev-line-a { stroke: var(--ev-fg); }
.ev-diagram .ev-line-b { stroke: var(--ev-train); }
.ev-diagram .ev-line-held { stroke: var(--ev-held); }
.ev-diagram .ev-key { stroke-width: 2.4; }
.ev-diagram .ev-dot-train { fill: var(--ev-train); }
.ev-diagram .ev-dot-held { fill: var(--background, #0a0f0a); stroke: var(--ev-held); stroke-width: 2.2; }
.ev-diagram .ev-cell-train { fill: color-mix(in srgb, var(--ev-train) 12%, var(--background, #0a0f0a)); stroke: var(--ev-train); stroke-opacity: .45; stroke-width: 1; }
.ev-diagram .ev-cell-test { fill: color-mix(in srgb, var(--ev-held) 22%, var(--background, #0a0f0a)); stroke: var(--ev-held); stroke-width: 1.4; }
.ev-diagram .ev-cell-text { fill: var(--ev-muted); font-size: 11.5px; }
.ev-diagram .ev-cell-text-test { fill: var(--ev-held); }
.ev-diagram .ev-score { fill: var(--ev-train); font-size: 15px; }</style><rect x="-6" y="-10" width="732" height="376" fill="#0a0f0a"/><title id="p">Training error and held-out error as model complexity grows</title><desc id="p">Illustration. Training error keeps falling as complexity rises. Held-out error falls, reaches a low point in the middle, then rises again. The gap on the right is overfitting.</desc><line class="ev-axis" x1="44" x2="44" y1="20" y2="290"></line><line class="ev-axis" x1="44" x2="696" y1="290" y2="290"></line><text class="ev-small" text-anchor="middle" transform="translate(22 155) rotate(-90)">error</text><text class="ev-small" x="370" y="312" text-anchor="middle">model complexity: simple to flexible</text><g opacity="1"><line class="ev-sweet" x1="333.77777777777777" x2="333.77777777777777" y1="24" y2="290"></line></g><path class="ev-line-b" d="M44.0 77.9C56.1 88.8 92.3 124.8 116.4 143.4C140.6 162.1 164.7 176.9 188.9 189.7C213.0 202.6 237.2 211.6 261.3 220.6C285.5 229.6 309.6 237.3 333.8 243.7C357.9 250.1 382.1 254.6 406.2 259.1C430.4 263.6 454.5 267.8 478.7 270.7C502.8 273.6 527.0 274.9 551.1 276.5C575.3 278.1 599.4 279.4 623.6 280.4C647.7 281.3 683.9 282.0 696.0 282.3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" opacity="1"></path><path class="ev-line-held" d="M44.0 66.3C56.1 76.6 92.3 111.3 116.4 128.0C140.6 144.7 164.7 156.9 188.9 166.6C213.0 176.2 237.2 181.4 261.3 185.9C285.5 190.4 309.6 193.6 333.8 193.6C357.9 193.6 382.1 190.4 406.2 185.9C430.4 181.4 454.5 174.9 478.7 166.6C502.8 158.2 527.0 147.3 551.1 135.7C575.3 124.1 599.4 111.3 623.6 97.1C647.7 83.0 683.9 58.6 696.0 50.9" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" opacity="1"></path><g opacity="1"><text class="ev-label ev-label-b" x="333.77777777777777" y="22" text-anchor="middle">sweet spot</text></g><g opacity="1"><text class="ev-label" x="58.48888888888889" y="243.7142857142857" text-anchor="start">underfitting</text><text class="ev-small" x="58.48888888888889" y="259.71428571428567" text-anchor="start">both errors high</text></g><g opacity="1"><text class="ev-label" x="686" y="205.14285714285714" text-anchor="end">overfitting</text><text class="ev-small" x="686" y="221.14285714285714" text-anchor="end">training keeps falling,</text><text class="ev-small" x="686" y="237.14285714285714" text-anchor="end">held-out climbs</text></g><g opacity="1"><line class="ev-miss" x1="694" x2="694" y1="52.85714285714283" y2="280.2857142857143"></line></g><g class="ev-legend"><line class="ev-key ev-line-b" x1="44" x2="66" y1="334" y2="334"></line><text class="ev-small" x="74" y="338">training error</text><line class="ev-key ev-line-held" x1="204" x2="226" y1="334" y2="334"></line><text class="ev-small" x="234" y="338">held-out error</text></g></svg>