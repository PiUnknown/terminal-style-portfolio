<svg xmlns="http://www.w3.org/2000/svg" class="ad-diagram" viewBox="0 0 720 360" role="img" aria-labelledby="rec-t rec-d"><style>svg{--ad-main:#00ff41;--ad-hot:#ffcc00;--ad-fg:#d1d5db;--ad-muted:#9ca3af;--background:#0a0f0a;background:#0a0f0a;font-family:monospace}
.ad-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.ad-diagram text { fill: var(--ad-fg); font-size: 13px; font-family: inherit; }
.ad-diagram .ad-small { fill: var(--ad-muted); font-size: 11.5px; }
.ad-diagram .ad-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background, #0a0f0a); stroke-width: 5px; stroke-linejoin: round; }
.ad-diagram .ad-label-main { fill: var(--ad-main); }
.ad-diagram .ad-label-hot { fill: var(--ad-hot); }
.ad-diagram .ad-legend-main { fill: var(--ad-main); }
.ad-diagram .ad-legend-hot { fill: var(--ad-hot); }
.ad-diagram .ad-stat { font-size: 14px; }
.ad-diagram .ad-stat-main { fill: var(--ad-main); }
.ad-diagram .ad-stat-hot { fill: var(--ad-hot); }
.ad-diagram .ad-axis { stroke: var(--ad-muted); stroke-width: 1.2; opacity: .8; }
.ad-diagram .ad-dot { fill: var(--ad-main); stroke: var(--background, #0a0f0a); stroke-width: 2; }
.ad-diagram .ad-dot-target { fill: var(--ad-hot); }
.ad-diagram .ad-cut { stroke: var(--ad-hot); stroke-width: 1.8; stroke-dasharray: 5 4; }
.ad-diagram .ad-dropped { fill: var(--ad-muted); opacity: .14; }
.ad-diagram .ad-curve { fill: none; stroke: var(--ad-main); stroke-width: 2; stroke-linejoin: round; }
.ad-diagram .ad-thresh { stroke: var(--ad-hot); stroke-width: 1.5; stroke-dasharray: 5 4; }
.ad-diagram .ad-marker { fill: none; stroke: var(--ad-hot); stroke-width: 2; }
.ad-diagram .ad-hill-normal { fill: color-mix(in srgb, var(--ad-main) 14%, var(--background, #0a0f0a)); stroke: var(--ad-main); stroke-opacity: .5; stroke-width: 1; }
.ad-diagram .ad-hill-fraud { fill: color-mix(in srgb, var(--ad-hot) 22%, var(--background, #0a0f0a)); stroke: var(--ad-hot); stroke-opacity: .7; stroke-width: 1; }
.ad-diagram .ad-flagged { fill: var(--ad-hot); opacity: .08; }
.ad-diagram .ad-legend-hot { fill: var(--ad-hot); }
.ad-diagram .ad-stat { font-size: 14px; }</style><title id="rec-t">Reconstruction error for 30 transactions against a threshold</title><desc id="rec-d">Most of the 30 transactions rebuild with errors near 0.1. Transaction 8 reaches 0.22 and stays under the dashed 0.30 threshold. Transaction 21 reaches 0.78, well over the threshold, and is flagged.</desc><g opacity="1"><line class="ad-axis" x1="64" y1="298" x2="690" y2="298"></line><line class="ad-axis" x1="64" y1="298" x2="64" y2="30"></line><text class="ad-small" x="58" y="302" text-anchor="end">0</text><text class="ad-small" x="58" y="168" text-anchor="end">0.5</text><text class="ad-small" x="58" y="34" text-anchor="end">1</text><text class="ad-small" x="64" y="316" text-anchor="middle">0</text><text class="ad-small" x="387.7931034482759" y="316" text-anchor="middle">15</text><text class="ad-small" x="690" y="316" text-anchor="middle">29</text><text class="ad-small" x="377" y="338" text-anchor="middle">transaction number</text><text class="ad-small" transform="rotate(-90 12 164)" x="12" y="164" text-anchor="middle">reconstruction error</text><path class="ad-curve" d="M64.0 276.6 L85.6 268.5 L107.2 279.2 L128.8 273.9 L150.3 265.8 L171.9 281.9 L193.5 271.2 L215.1 276.6 L236.7 239.0 L258.3 273.9 L279.9 268.5 L301.4 279.2 L323.0 271.2 L344.6 276.6 L366.2 273.9 L387.8 265.8 L409.4 279.2 L431.0 271.2 L452.6 273.9 L474.1 276.6 L495.7 268.5 L517.3 89.0 L538.9 271.2 L560.5 279.2 L582.1 273.9 L603.7 268.5 L625.2 276.6 L646.8 271.2 L668.4 279.2 L690.0 273.9 "></path></g><g opacity="1"><line class="ad-thresh" x1="64" y1="217.60000000000002" x2="690" y2="217.60000000000002"></line><text class="ad-label ad-label-hot" x="690" y="211.60000000000002" text-anchor="end">threshold 0.30</text></g><g opacity="1"><circle class="ad-marker" cx="517.3103448275863" cy="88.95999999999998" r="9"></circle><text class="ad-label ad-label-hot" x="503.3103448275863" y="92.95999999999998" text-anchor="end">flagged: error 0.78</text></g><g opacity="1"><line class="ad-axis" x1="236.68965517241378" y1="233.04" x2="236.68965517241378" y2="189.60000000000002"></line><text class="ad-label" x="236.68965517241378" y="183.60000000000002" text-anchor="middle">0.22: under the line, not flagged</text></g></svg>
