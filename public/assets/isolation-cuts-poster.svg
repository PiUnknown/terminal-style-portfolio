<svg xmlns="http://www.w3.org/2000/svg" class="ad-diagram" viewBox="0 0 720 272" role="img" aria-labelledby="iso-t iso-d"><style>svg{--ad-main:#00ff41;--ad-hot:#ffcc00;--ad-fg:#d1d5db;--ad-muted:#9ca3af;--background:#0a0f0a;background:#0a0f0a;font-family:monospace}
.ad-diagram { display: block; width: 100%; height: auto; overflow: visible; }
.ad-diagram text { fill: var(--ad-fg); font-size: 13px; font-family: inherit; }
.ad-diagram .ad-small { fill: var(--ad-muted); font-size: 11.5px; }
.ad-diagram .ad-label { font-size: 12.5px; paint-order: stroke fill; stroke: var(--background, #0a0f0a); stroke-width: 5px; stroke-linejoin: round; }
.ad-diagram .ad-label-main { fill: var(--ad-main); }
.ad-diagram .ad-label-hot { fill: var(--ad-hot); }
.ad-diagram .ad-axis { stroke: var(--ad-muted); stroke-width: 1.2; opacity: .8; }
.ad-diagram .ad-dot { fill: var(--ad-main); stroke: var(--background, #0a0f0a); stroke-width: 2; }
.ad-diagram .ad-dot-off { fill: var(--ad-muted); }
.ad-diagram .ad-dot-target { fill: var(--ad-hot); }
.ad-diagram .ad-cut { stroke: var(--ad-hot); stroke-width: 1.8; stroke-dasharray: 5 4; }
.ad-diagram .ad-break { stroke: var(--ad-muted); stroke-width: 1.2; opacity: .8; }
.ad-diagram .ad-bracket { stroke: var(--ad-muted); stroke-width: 1; opacity: .5; }
.ad-diagram .ad-chip { fill: var(--background, #0a0f0a); stroke: var(--ad-hot); stroke-width: 1.2; }
.ad-diagram .ad-chip-text { fill: var(--ad-hot); font-size: 10px; font-weight: 600; }</style><title id="iso-t">Random cuts isolate an odd payment fast and a normal one slowly</title><desc id="iso-d">Nine payment amounts on one axis. The empty stretch between 460 and 4,000 rupees is compressed, marked with a break, so the crowded 380 to 460 region stays readable. Every payment stays on screen; payments a cut discards fade to grey, and cuts are numbered in the order they happened. The 4,000 rupee payment is alone after one cut. A payment of 420 rupees inside the crowd needs five cuts in this run; averaged over 20,000 simulated runs it needs about five, against about one for the 4,000 rupee payment.</desc><g opacity="1"><text class="ad-label ad-label-main" x="60" y="20">payment of ₹4,000</text><text class="ad-label ad-label-hot" x="660" y="20" text-anchor="end">isolated after 1 cut</text><line class="ad-axis" x1="60" y1="70" x2="432" y2="70"></line><line class="ad-axis" x1="458" y1="70" x2="660" y2="70"></line><line class="ad-break" x1="438.8" y1="65" x2="444.5" y2="75"></line><line class="ad-break" x1="444.5" y1="65" x2="450.2" y2="75"></line><line class="ad-bracket" x1="60" y1="90" x2="432" y2="90"></line><line class="ad-bracket" x1="60" y1="86" x2="60" y2="94"></line><line class="ad-bracket" x1="432" y1="86" x2="432" y2="94"></line><text class="ad-small" x="246" y="108" text-anchor="middle">the crowd · ₹380–₹460</text><line class="ad-cut" x1="557.3" y1="48" x2="557.3" y2="74"></line><circle class="ad-chip" cx="557.3" cy="38" r="8"></circle><text class="ad-chip-text" x="557.3" y="41.5" text-anchor="middle">1</text><circle class="ad-dot ad-dot-off" cx="60" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="129.8" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="153" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="199.5" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="246" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="292.5" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="362.3" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="432" cy="70" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-target" cx="660" cy="70" r="7"></circle><text class="ad-label ad-label-main" x="60" y="160">payment of ₹420</text><text class="ad-label ad-label-hot" x="660" y="160" text-anchor="end">isolated after 5 cuts</text><line class="ad-axis" x1="60" y1="210" x2="432" y2="210"></line><line class="ad-axis" x1="458" y1="210" x2="660" y2="210"></line><line class="ad-break" x1="438.8" y1="205" x2="444.5" y2="215"></line><line class="ad-break" x1="444.5" y1="205" x2="450.2" y2="215"></line><line class="ad-bracket" x1="60" y1="230" x2="432" y2="230"></line><line class="ad-bracket" x1="60" y1="226" x2="60" y2="234"></line><line class="ad-bracket" x1="432" y1="226" x2="432" y2="234"></line><text class="ad-small" x="246" y="248" text-anchor="middle">the crowd · ₹380–₹460</text><line class="ad-cut" x1="517.3" y1="188" x2="517.3" y2="214"></line><circle class="ad-chip" cx="517.3" cy="178" r="8"></circle><text class="ad-chip-text" x="517.3" y="181.5" text-anchor="middle">1</text><line class="ad-cut" x1="357.6" y1="188" x2="357.6" y2="214"></line><circle class="ad-chip" cx="357.6" cy="178" r="8"></circle><text class="ad-chip-text" x="357.6" y="181.5" text-anchor="middle">2</text><line class="ad-cut" x1="176.3" y1="188" x2="176.3" y2="214"></line><circle class="ad-chip" cx="176.3" cy="178" r="8"></circle><text class="ad-chip-text" x="176.3" y="181.5" text-anchor="middle">3</text><line class="ad-cut" x1="269.3" y1="188" x2="269.3" y2="214"></line><circle class="ad-chip" cx="269.3" cy="178" r="8"></circle><text class="ad-chip-text" x="269.3" y="181.5" text-anchor="middle">4</text><line class="ad-cut" x1="222.8" y1="188" x2="222.8" y2="214"></line><circle class="ad-chip" cx="222.8" cy="178" r="8"></circle><text class="ad-chip-text" x="222.8" y="181.5" text-anchor="middle">5</text><circle class="ad-dot ad-dot-off" cx="60" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="129.8" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="153" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="199.5" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="292.5" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="362.3" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="432" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-off" cx="660" cy="210" r="5" opacity=".4"></circle><circle class="ad-dot ad-dot-target" cx="246" cy="210" r="7"></circle></g></svg>
