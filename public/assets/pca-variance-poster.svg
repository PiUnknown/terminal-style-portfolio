<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-label="Bars show explained variance shares of 42, 26, 14, 7, 4, 3, 2, 1, 0.5 and 0.5 percent. The cumulative curve reaches 96 percent at component 6, the first component count above the 95 percent target.">
<style>
svg{--main:#00ff41;--accent:#ffcc00;--fg:#d1d5db;--muted:#9ca3af;--bg:#0a0f0a;--card:#0d1a0d;background:var(--bg);font-family:'JetBrains Mono',monospace}
text{fill:var(--fg);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}.small{fill:var(--muted);font-size:11px}.grid{stroke:rgba(0,255,65,.14);stroke-width:1}.bar{fill:rgba(0,255,65,.2);stroke:var(--main);stroke-opacity:.72;stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}.target{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4}.guide{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.72}.accent{fill:var(--accent)}.callout{fill:var(--card);stroke:var(--accent);stroke-width:1}.result{fill:var(--main);font-weight:600}
</style>
